# Componentes versionáveis deste repositório.
#
# Consumido pela skill jira-release-executor: é daqui que ela sabe o que
# versionar, como filtrar escopo quando Rafinha pede um componente só, e
# como mapear issue -> componente (casando o `path` com os arquivos do PR).
#
# Os steps de build do release.yml são escritos explicitamente por
# componente e mantidos em sincronia com este arquivo na mão. Se os dois
# divergirem, o release.yml é quem builda - mas isso é um bug a corrigir.

components:
  - name: compass-api
    path: compass-api
    type: maven
    version_file: compass-api/pom.xml
    dispatch_input: api_version

  - name: routecraft_app
    path: routecraft_app
    type: flutter
    version_file: routecraft_app/pubspec.yaml
    dispatch_input: routecraft_version

  - name: travel_matrix
    path: travel_matrix
    type: flutter
    version_file: travel_matrix/pubspec.yaml
    dispatch_input: travel_matrix_version
