name: CI

on:
  pull_request:
    branches: [develop, main, release/current, 'epic/**']
  push:
    branches: [develop, release/current]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: compass-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compass-api
    # RabbitMQ efêmero (CPS-146): o @RabbitListener do NotificationConsumer
    # tenta conectar já na subida do contexto Spring - sem isso, todo teste
    # com @SpringBootTest falharia ao iniciar, não só os novos desta feature.
    services:
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: compass_user
          RABBITMQ_DEFAULT_PASS: compass_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: compass-api/pom.xml

      - name: Testes automatizados (H2)
        run: ./mvnw -B test

      - name: Build (package)
        run: ./mvnw -B package -DskipTests

  travel-matrix:
    name: travel_matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel_matrix
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes automatizados
        run: flutter test

      - name: Build (web)
        run: flutter build web

  routecraft:
    name: routecraft_app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routecraft_app
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes automatizados
        run: flutter test

      - name: Build (web)
        run: flutter build web
