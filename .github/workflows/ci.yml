name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: compass-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compass-api
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: compass-api/pom.xml

      - name: Testes automatizados (H2)
        run: ./mvnw -B test

      - name: Build (package)
        run: ./mvnw -B package -DskipTests

  travel-matrix:
    name: travel_matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel_matrix
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes automatizados
        run: flutter test

      - name: Build (web)
        run: flutter build web
