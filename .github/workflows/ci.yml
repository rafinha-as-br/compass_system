name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: compass-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compass-api
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: compass-api/pom.xml

      - name: Testes automatizados (H2)
        run: ./mvnw -B test

      - name: Build (package)
        run: ./mvnw -B package -DskipTests

  travel-matrix:
    name: travel_matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel_matrix
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes automatizados
        run: flutter test

      - name: Build (web)
        run: flutter build web

  routecraft:
    name: routecraft_app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routecraft_app
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes automatizados
        run: flutter test

      - name: Build (web)
        run: flutter build web

  # TEMPORÁRIO — regenerar goldens do routecraft_app no runner real do CI
  # (paridade com o ambiente que valida os PRs). Removido antes do merge final.
  update-goldens:
    name: update-goldens (temporário)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routecraft_app
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Regenerar goldens
        run: flutter test --update-goldens test/golden/ || true

      - name: Publicar goldens como artifact
        uses: actions/upload-artifact@v4
        with:
          name: routecraft-goldens
          path: routecraft_app/test/golden/goldens/
          retention-days: 1
