name: Release

# Fechar uma versao: cria a release branch, faz o bump de cada componente que
# recebeu versao, builda os tres, publica os artefatos e cria uma tag/Release
# por componente. Deixe um campo de versao em branco para nao versionar
# aquele componente nesta rodada.
#
# release_type distingue pre-release (so tag + artefato) de final (tag +
# artefato + GitHub Release, com as notas de .github/release-notes/). publish
# nao e um terceiro tipo: diz se esta execucao publica ou so builda/valida.
on:
  workflow_dispatch:
    inputs:
      routecraft_version:
        description: 'Versao do routecraft_app (ex.: 1.1.0 ou 1.1.0-rc.1) - vazio = nao versiona'
        required: false
        default: ''
      travel_matrix_version:
        description: 'Versao do travel_matrix (ex.: 1.1.0 ou 1.1.0-rc.1) - vazio = nao versiona'
        required: false
        default: ''
      api_version:
        description: 'Versao do compass-api (ex.: 0.1.0 ou 0.1.0-rc.1) - vazio = nao versiona'
        required: false
        default: ''
      release_type:
        description: 'Tipo da versao produzida'
        type: choice
        options: [pre_release, final]
        default: pre_release
      publish:
        description: 'Criar tags e (em final) GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: compass-api/pom.xml

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      # ---------------------------------------------------------------- branch
      - name: Criar a release branch
        id: branch
        run: |
          BRANCH="release/$(date +%Y-%m-%d)-${{ github.run_number }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------- bump
      # mvn versions:set em vez de sed: o pom.xml tem o <version> do
      # spring-boot-starter-parent antes do <version> do projeto.
      - name: Bump das versoes
        run: |
          set -e
          if [ -n "${{ inputs.api_version }}" ]; then
            (cd compass-api && ./mvnw -B versions:set \
              -DnewVersion='${{ inputs.api_version }}' -DgenerateBackupPoms=false)
          fi
          if [ -n "${{ inputs.routecraft_version }}" ]; then
            sed -i "s/^version: .*/version: ${{ inputs.routecraft_version }}+${{ github.run_number }}/" \
              routecraft_app/pubspec.yaml
          fi
          if [ -n "${{ inputs.travel_matrix_version }}" ]; then
            sed -i "s/^version: .*/version: ${{ inputs.travel_matrix_version }}+${{ github.run_number }}/" \
              travel_matrix/pubspec.yaml
          fi
          git diff --stat

      - name: Commit e push da release branch
        run: |
          if git diff --quiet; then
            echo "Nenhum bump de versao nesta rodada."
          else
            git commit -am "release: bump de versao (run ${{ github.run_number }})"
          fi
          git push origin "${{ steps.branch.outputs.name }}"

      # ------------------------------------------------------------- builds
      - name: Build compass-api (jar)
        run: cd compass-api && ./mvnw -B package -DskipTests

      - name: Build routecraft_app (apk)
        run: |
          cd routecraft_app
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/routecraft_app.apk

      - name: Build travel_matrix (web + apk)
        run: |
          cd travel_matrix
          flutter pub get
          flutter build web --release
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/travel_matrix.apk

      # -------------------------------------------------------- web zip
      # Feito aqui (nao so' na hora do release final) para que o artefato
      # de pre-release por componente ja' carregue o build web zipado.
      # Nao existe versao web do routecraft_app - so o travel_matrix precisa.
      - name: Zipar o build web do travel_matrix
        run: |
          set -e
          cd travel_matrix/build/web && zip -qr "$GITHUB_WORKSPACE/travel_matrix-web.zip" . && cd "$GITHUB_WORKSPACE"

      # ------------------------------------------------------------ artefatos
      # Sobem antes das tags: se a publicacao falhar, os arquivos ja estao la.
      # Um artefato por componente, nomeado "<chave-do-manifesto>-<versao>":
      # e' o nome que o orchestrate.ps1 busca (gh run download --name) para
      # coletar uma pre-release, que nao tem GitHub Release. So sobe quando
      # o componente recebeu versao nesta rodada (input correspondente nao-vazio).
      - name: Publicar artefato - compass_api
        if: ${{ inputs.api_version != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: compass_api-${{ inputs.api_version }}
          path: compass-api/target/*.jar
          retention-days: 30

      - name: Publicar artefato - routecraft_app
        if: ${{ inputs.routecraft_version != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: routecraft_app-${{ inputs.routecraft_version }}
          path: routecraft_app/build/app/outputs/flutter-apk/routecraft_app.apk
          retention-days: 30

      - name: Publicar artefato - travel_matrix
        if: ${{ inputs.travel_matrix_version != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: travel_matrix-${{ inputs.travel_matrix_version }}
          path: |
            travel_matrix-web.zip
            travel_matrix/build/app/outputs/flutter-apk/travel_matrix.apk
          retention-days: 30

      # -------------------------------------------------- tags + releases
      - name: Criar tags e, em release final, as GitHub Releases
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -e
          # A tag existe sempre (inclusive em pre-release): amarra artefato <->
          # commit no release-manifest.yml da distribuicao. A GitHub Release so
          # e criada em release_type=final. Notas em .github/release-notes/,
          # com fallback para a versao base e depois para --generate-notes.
          tag_and_release () {
            local comp="$1" version="$2"; shift 2
            [ -z "$version" ] && return 0

            local tag="$comp/v$version"
            git tag -a "$tag" -m "$comp v$version"
            git push origin "$tag"
            echo "tag criada: $tag"

            if [ "$RELEASE_TYPE" != "final" ]; then
              echo "release_type=$RELEASE_TYPE - sem GitHub Release, so' tag + artefato"
              return 0
            fi

            local base="${version%%-*}"
            local notes=".github/release-notes/$comp-$version.md"
            [ -f "$notes" ] || notes=".github/release-notes/$comp-$base.md"

            if [ -f "$notes" ]; then
              echo "Release notes: $notes"
              gh release create "$tag" "$@" \
                --title "$comp v$version" \
                --target "${{ steps.branch.outputs.name }}" \
                --notes-file "$notes"
            else
              echo "Sem arquivo de notas, usando --generate-notes"
              gh release create "$tag" "$@" \
                --title "$comp v$version" \
                --target "${{ steps.branch.outputs.name }}" \
                --generate-notes
            fi
          }

          tag_and_release compass-api "${{ inputs.api_version }}" compass-api/target/*.jar
          tag_and_release routecraft_app "${{ inputs.routecraft_version }}" routecraft_app/build/app/outputs/flutter-apk/routecraft_app.apk
          tag_and_release travel_matrix "${{ inputs.travel_matrix_version }}" travel_matrix-web.zip travel_matrix/build/app/outputs/flutter-apk/travel_matrix.apk

      - name: Resumo
        run: |
          {
            echo "### Release"
            echo ""
            echo "- Branch: \`${{ steps.branch.outputs.name }}\`"
            echo "- Tipo: \`${{ inputs.release_type }}\`  |  publish: \`${{ inputs.publish }}\`"
            echo "- routecraft_app: \`${{ inputs.routecraft_version || 'nao versionado' }}\`"
            echo "- travel_matrix: \`${{ inputs.travel_matrix_version || 'nao versionado' }}\`"
            echo "- compass-api: \`${{ inputs.api_version || 'nao versionado' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
