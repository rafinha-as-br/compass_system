version: '3.8'

services:

  db:
    image: postgres:15
    container_name: compass_postgres
    environment:
      POSTGRES_USER: compass_user
      POSTGRES_PASSWORD: compass_password
      POSTGRES_DB: compass_db
    ports:
      - "5432:5432"

  # Broker AMQP para os eventos de notificação (CPS-146) — desacopla a
  # geração do evento (na transação HTTP) do disparo do push (best-effort,
  # fora da transação). UI de management em http://localhost:15672.
  rabbitmq:
    image: rabbitmq:3-management
    container_name: compass_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: compass_user
      RABBITMQ_DEFAULT_PASS: compass_password
    ports:
      - "5672:5672"
      - "15672:15672"

  # Relay self-hosted de UnifiedPush (CPS-146) — o RouteCraft (Android) se
  # inscreve num tópico aqui em vez de depender do ntfy.sh público ou de
  # qualquer infra de push da Google/Firebase.
  ntfy:
    image: binwiederhier/ntfy
    container_name: compass_ntfy
    command: serve
    ports:
      - "8082:80"

  backend:
    build: .
    container_name: compass_backend
    ports:
      - "8081:8081"
    depends_on:
      - db
      - rabbitmq
      - ntfy
    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/compass_db
      SPRING_DATASOURCE_USERNAME: compass_user
      SPRING_DATASOURCE_PASSWORD: compass_password