spring.datasource.url=jdbc:postgresql://localhost:5432/compass_db
spring.datasource.username=compass_user
spring.datasource.password=compass_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
server.port=8081

# JWT Configuration
jwt.secret=compass-system-secret-key-que-deve-ter-pelo-menos-256-bits-ok
jwt.expiration-ms=86400000

# Mail (recuperação de senha) - provedor de teste/dev; configure credenciais reais via variáveis de ambiente
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.password-reset.token-expiration-minutes=30

# RabbitMQ (CPS-146) - broker self-hosted, junto com o compass-api (ver docker-compose.yml)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:compass_user}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:compass_password}

# Push (CPS-146)
# ntfy self-hosted (UnifiedPush relay para o RouteCraft/Android)
push.ntfy.base-url=${PUSH_NTFY_BASE_URL:http://localhost:8082/}
