spring.datasource.url=jdbc:postgresql://localhost:5432/compass_db
spring.datasource.username=compass_user
spring.datasource.password=compass_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
server.port=8081

# JWT Configuration
jwt.secret=compass-system-secret-key-que-deve-ter-pelo-menos-256-bits-ok
jwt.expiration-ms=86400000

# Mail (recuperação de senha) - provedor de teste/dev; configure credenciais reais via variáveis de ambiente
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.password-reset.token-expiration-minutes=30

# RabbitMQ (CPS-146) - broker self-hosted, junto com o compass-api (ver docker-compose.yml)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:compass_user}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:compass_password}

# Push (CPS-146)
# Android (UnifiedPush) não precisa de config aqui: o endpoint de cada
# destino já vem pronto do cliente no registro (POST /push-targets), a
# própria ntfy self-hosted só entra como o relay que o dispositivo aponta
# para o distribuidor UnifiedPush instalado nele - nada disso passa por
# configuração do compass-api.
# VAPID (Web Push para o Travel Matrix) - par de chaves de DEV gerado localmente;
# produção deve sobrescrever via variável de ambiente, nunca reusar este par.
push.vapid.public-key=${PUSH_VAPID_PUBLIC_KEY:BDxTKuiSpVEObcO4IxfgAhG4m-kMG30CK-Mmn6LfDB9JtyzJI_ejGo4rMPX-qfltmqrx_pq2eoICxb_L3gjqKFo}
push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY:G9d7eVh82S27gLvrzqLdD5gVuYvD-RZlYFJKDAohfnA}
push.vapid.subject=${PUSH_VAPID_SUBJECT:mailto:dev@compass.local}

# Fachada de geocodificação (Nominatim/OpenStreetMap) — CPS-144/CPS-152
app.nominatim.base-url=https://nominatim.openstreetmap.org/search
app.nominatim.user-agent=CompassSystem/1.0 (+https://github.com/rafinha-as-br/compass_system)
app.nominatim.cache-ttl-hours=24
app.nominatim.min-interval-ms=1000
