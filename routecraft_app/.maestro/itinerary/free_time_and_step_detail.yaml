appId: com.example.routecraft_app
---
# CPS-91 + CPS-92: full timeline for a trip with a multi-day step (Hosting)
# still shows a correct "free time" gap on days it covers (regression for the
# bug where a multi-day step suppressed free time for the whole trip), and
# tapping a step opens CPS-92's detail bottom sheet with the right subtype
# fields.
#
# Fixed defect (CPS-92, confirmed 2026-09-10): the Bus transport's "Gate"
# info tile used to always render even when `departureGate` was empty,
# showing a label with no value. `step_detail_sheet.dart` (`_transportTiles`,
# `Bus`/`Airplane` cases) now guards it with `if (departureGate.isNotEmpty)`.
# The steps below re-check the exact fixture that reproduced the bug
# ("Bus to Kyoto", `departureGate: null` in QA Trip CPS-89) — Gate must not
# be visible.
- runFlow: ../common/login_as_joao.yaml
- waitForAnimationToEnd
- tapOn: ".*QA Trip CPS-89.*"
- tapOn: "Open full itinerary"
- assertVisible: "Day 1 · Monday"
- assertVisible: ".*Free time.*"
- tapOn: ".*Flight to Tokyo.*"
- assertVisible: "Travel segment · Airplane"
- assertVisible: "Origin"
- assertVisible: "Sao Paulo (GRU)"
- back
- tapOn: ".*Shinjuku Granbell Hotel.*"
- assertVisible: "Hosting"
- assertVisible: "Check-in"
- assertVisible: "Check-out"
- back
- tapOn: "D3"
- tapOn: ".*Bus to Kyoto.*"
- assertVisible: "Travel segment · Bus"
- assertNotVisible: "Gate"
- takeScreenshot: cps92_bus_gate_fix_evidence
- back
