appId: com.example.travel_matrix
---
# Login por UI com o agente fixo de QA (qa.claude.cps114@compass.test / QaClaude123!).
# Conta criada via POST /api/auth/cadastrar/agente (CPS-158/159, 2026-09-29) para ter uma
# credencial de agente estável. Se o banco for recriado, rode compass-api/scripts/seed_test_data.py:
# ele recria esta conta (empresa compass.test, chave de bootstrap) e os clientes/viagens da empresa.
#
# Atualizado em 2026-10-16 (QA da CPS-198): a landing/login agora têm layout mobile em
# coluna única, então os campos expõem o hint ("Email"/"Password") na árvore semântica e
# são tocados por texto. Antes (CPS-167) o overflow escondia o hint e o flow usava
# coordenadas percentuais (83%,58% / 83%,65%), que deixaram de valer.
# O teclado é fechado com `back` para não cobrir o botão de login.
- launchApp:
    clearState: true
- tapOn: "Access Travel Matrix"
- tapOn: "Email"
- inputText: "qa.claude.cps114@compass.test"
- back
- tapOn: "Password"
- inputText: "QaClaude123!"
- back
- tapOn: "LOGIN AS AGENT"
# assertVisible só é confiável em elementos clicáveis neste app; o dashboard logado mostra
# o botão do menu/top bar, então a confirmação é a saída da tela de login.
- assertNotVisible: "LOGIN AS AGENT"
- takeScreenshot: login_qa_agent_dashboard
