# Troca de senha obrigatória no primeiro login do agente convidado (CPS-196 API + CPS-197 tela).
#
# Pré-condição: um agente recém-convidado, com senha temporária ainda não trocada. Crie um por
# execução (a senha temporária só aparece uma vez):
#   POST /api/companies/me/agents/invite  (token de OWNER, corpo {"name": "..."})
# e passe o login e a senha temporária retornados:
#   maestro test -e LOGIN=<login> -e TEMP_PASSWORD=<senha temporária> -e NEW_PASSWORD=<nova, >= 8 caracteres> \
#     .maestro/travel_matrix/auth/forced_password_change.yaml
#
# Cobre: o login leva à tela "Set your new password" (nada além dela é alcançável), o botão
# voltar do Android sai do app sem chegar ao painel, o reabrir app cai de novo na tela de troca,
# senha atual errada mostra o erro da API, a troca válida leva ao painel.
# Textos em inglês: o AVD `QA - Claude` roda em en-US; o erro da API vem em português
# ("A senha atual está incorreta."), por isso o matcher ".*incorreta.*".
appId: com.example.travel_matrix
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Access Travel Matrix"
    timeout: 40000
- tapOn: "Access Travel Matrix"
- tapOn: "Email"
- inputText: ${LOGIN}
- back
- tapOn: "Password"
- inputText: ${TEMP_PASSWORD}
- back
- tapOn: "LOGIN AS AGENT"
- extendedWaitUntil:
    visible: "Current Password"
    timeout: 15000
- assertVisible: "New Password"
- assertVisible: "Confirm New Password"
- takeScreenshot: forced_change_screen
# O botão voltar não leva ao painel: sai do app; ao reabrir, a tela de troca continua sendo a única.
- pressKey: back
- launchApp
- extendedWaitUntil:
    visible: "Current Password"
    timeout: 30000
# Senha atual errada: erro da API, continua na tela.
- tapOn: "Current Password"
- inputText: "senha-atual-errada"
- back
- tapOn: "New Password"
- inputText: ${NEW_PASSWORD}
- back
- tapOn: "Confirm New Password"
- inputText: ${NEW_PASSWORD}
- back
- tapOn: "Update"
- extendedWaitUntil:
    visible: ".*incorreta.*"
    timeout: 8000
- takeScreenshot: forced_change_wrong_current
# Troca válida. Reabre o app (cai de novo na tela de troca, com o formulário limpo): o eraseText
# apaga a partir do cursor e deixava resto da senha errada no campo.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Current Password"
    timeout: 30000
- tapOn: "Current Password"
- inputText: ${TEMP_PASSWORD}
- back
- tapOn: "New Password"
- inputText: ${NEW_PASSWORD}
- back
- tapOn: "Confirm New Password"
- inputText: ${NEW_PASSWORD}
- back
- tapOn: "Update"
- extendedWaitUntil:
    visible: "Welcome.*"
    timeout: 15000
- assertNotVisible: "Current Password"
- takeScreenshot: forced_change_dashboard
